<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Harga Quick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: katalog di kiri, ringkasan penawaran menempel di kanan; di HP ditumpuk dengan bar total di bawah. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --surface2: #e9eee6;
  --line: #d7ded3;
  --fg: #1a2118;
  --muted: #5a6557;
  --accent: #2c6a38;
  --on-accent: #ffffff;
  --accent-soft: #dcebdc;
  --warn: #8a5200;
  --warn-bg: #fff0d1;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11160f; --surface: #1a2117; --surface2: #242c21; --line: #303a2c;
    --fg: #e5eae2; --muted: #98a493; --accent: #7cc28a; --on-accent: #0e180f;
    --accent-soft: #22381f; --warn: #f0b75a; --warn-bg: #3a2c10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11160f; --surface: #1a2117; --surface2: #242c21; --line: #303a2c;
  --fg: #e5eae2; --muted: #98a493; --accent: #7cc28a; --on-accent: #0e180f;
  --accent-soft: #22381f; --warn: #f0b75a; --warn-bg: #3a2c10; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 88px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--font-head); font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
.branch { display: flex; flex-direction: column; gap: 4px; }
.branch label, .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
select, input[type=search], input[type=number] {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 38px;
}
select { min-width: 180px; font-weight: 500; }

.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 900px) { .main { grid-template-columns: minmax(0, 1fr) 390px; } .side { position: sticky; top: 16px; } .bar { display: none !important; } body { padding-bottom: 24px; } }

.toolbar { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 220px; }
.field select, .field input { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .grp { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 2px; min-width: 88px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sech { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface2); border-block: 1px solid var(--line); font-family: var(--font-head); font-weight: 600; font-size: 13px; }
.sech:first-child { border-top: 0; }
.sech small { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: 12px; }
.pill { font-family: var(--font-body); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 16px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.locked { opacity: 0.5; }
.row.on { background: var(--accent-soft); }
.nm { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.nm small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; }
.pr { text-align: right; white-space: nowrap; }
.pr .net { font-weight: 600; }
.pr .list { display: block; color: var(--muted); font-size: 12px; text-decoration: line-through; background: none; border: 0; }
@media (max-width: 560px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .pr { grid-column: 1; text-align: left; } .row .step { grid-column: 2; grid-row: 1 / span 2; } }

.step { display: inline-flex; align-items: center; gap: 2px; }
.step button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; line-height: 1; }
.step button:hover:not(:disabled) { border-color: var(--accent); }
.step button:disabled { cursor: not-allowed; opacity: 0.5; }
.step .q { min-width: 28px; text-align: center; font-weight: 600; }
.step .add { width: auto; padding: 0 12px; font-size: 13px; font-weight: 600; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

.cart { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; }
.cart > * { padding-inline: 14px; }
.cart h2 { font-family: var(--font-head); font-size: 16px; margin: 0; padding-block: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; padding: 4px 0; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; margin: 10px 14px 0; font-size: 13px; }
.note.ok { background: var(--accent-soft); color: var(--accent); }
.lines { padding-block: 6px; max-height: 340px; overflow-y: auto; }
.lines h3 { margin: 10px 0 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ln { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: center; }
.ln .t { font-weight: 500; overflow-wrap: anywhere; font-size: 13px; }
.ln .t.bad { color: var(--warn); }
.ln .s { color: var(--muted); font-size: 12px; }
.ln .step button { width: 26px; height: 26px; }
.ln .amt { text-align: right; font-weight: 600; }
.sum { padding-block: 10px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.sum .muted { color: var(--muted); }
.sum .r { text-align: right; }
.sum .neg { color: var(--accent); }
.total { padding-block: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.total .v { font-family: var(--font-head); font-size: 24px; font-weight: 600; }
.save { color: var(--accent); font-size: 12px; text-align: right; padding-bottom: 12px; }
.acts { padding-block: 0 14px; display: flex; gap: 8px; }
.btn { flex: 1; border-radius: 6px; padding: 10px 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.alt { background: var(--surface); color: var(--fg); border-color: var(--line); }
details.cfg { border-top: 1px solid var(--line); padding-block: 10px; }
details.cfg summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.cfgg { display: grid; grid-template-columns: 1fr 84px; gap: 8px 12px; align-items: center; margin-top: 10px; font-size: 13px; }
.cfgg input[type=number] { width: 100%; text-align: right; }
.chk { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-start; }
.chk input { margin-top: 3px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.bar .v { font-family: var(--font-head); font-size: 18px; font-weight: 600; }
.bar .btn { flex: 0 0 auto; }
@media (prefers-reduced-motion: no-preference) { .row, .chip, .step button { transition: background-color .12s, border-color .12s; } }
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Kalkulator Harga Quick</h1>
      <p class="sub">Pricelist resmi non-peti, 7 cabang. Dipakai internal.</p>
    </div>
    <div class="branch">
      <label for="branch">Cabang</label>
      <select id="branch"></select>
    </div>
  </header>

  <div class="main">
    <section aria-label="Daftar produk">
      <div class="toolbar">
        <div class="filters">
          <div class="field"><label class="lbl" for="cat">Kategori</label><select id="cat"></select></div>
          <div class="field grow"><label class="lbl" for="q">Cari</label><input id="q" type="search" placeholder="mis. G 1000, Kronos, roda besi"></div>
        </div>
      </div>
      <div class="list" id="list" style="margin-top:16px"></div>
    </section>

    <aside class="side" id="ringkasan" aria-label="Ringkasan penawaran">
      <div class="cart">
        <h2><span>Ringkasan penawaran</span><button class="link" id="clear" type="button">Kosongkan</button></h2>
        <div id="notes"></div>
        <div class="lines" id="lines"></div>
        <div class="sum" id="sum"></div>
        <div class="total"><span class="lbl">Total nett</span><span class="v num" id="total">Rp 0</span></div>
        <div class="save num" id="save"></div>
        <div class="acts">
          <button class="btn" id="copy" type="button">Salin penawaran</button>
        </div>
        <details class="cfg">
          <summary>Pengaturan diskon</summary>
          <div class="cfgg">
            <label for="rUnit">Diskon unit (%)</label><input id="rUnit" type="number" min="0" max="100" step="0.5" value="20">
            <label for="rAcc">Diskon perlengkapan saja (%)</label><input id="rAcc" type="number" min="0" max="100" step="0.5" value="12">
            <label for="rBun">Perlengkapan bareng unit (%)</label><input id="rBun" type="number" min="0" max="100" step="0.5" value="20">
          </div>
        </details>
      </div>
    </aside>
  </div>
</div>

<div class="bar" id="bar">
  <div><div class="lbl">Total nett</div><div class="v num" id="barTotal">Rp 0</div></div>
  <button class="btn" id="toCart" type="button">Lihat ringkasan</button>
</div>

const { branches: BR, sections: SECS, items: ITEMS } = DATA;
const SEC = Object.fromEntries(SECS.map(s => [s.id, s]));
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Contoh isi awal supaya kalkulator terlihat bekerja. Klik "Kosongkan" untuk mulai dari nol.
const st = { branch: 0, qty: { 2: 1, 62: 1 }, cat: 1, q: '', rUnit: 20, rAcc: 12, rBun: 20 };

function parts(it) {
  const i = it.name.indexOf(' (');
  if (SEC[it.sec].basic && i > 0) return [it.name.slice(0, i), it.name.slice(i + 2).replace(/\)$/, '')];
  return [it.name, ''];
}

// Perlengkapan Rotary/Mower (kecuali Zena): diskon bundling hanya jika ada unit Basic. Lainnya: jika ada unit apa pun.
const basicRule = i => SEC[i.sec].needsBasic && !/zena/i.test(i.name);
function calc() {
  const lines = ITEMS.filter(i => (st.qty[i.id] || 0) > 0);
  const hasUnit = lines.some(i => SEC[i.sec].kind === 'unit');
  const hasBasic = lines.some(i => SEC[i.sec].basic);
  const rate = i => SEC[i.sec].kind === 'unit' ? st.rUnit : ((basicRule(i) ? hasBasic : hasUnit) ? st.rBun : st.rAcc);
  const net = i => Math.round(i.p[st.branch] * (1 - rate(i) / 100));
  const out = { hasUnit, hasBasic, rate, net, unit: [], acc: [], listUnit: 0, netUnit: 0, listAcc: 0, netAcc: 0 };
  for (const i of lines) {
    const q = st.qty[i.id], l = i.p[st.branch] * q, n = net(i) * q;
    if (SEC[i.sec].kind === 'unit') { out.unit.push(i); out.listUnit += l; out.netUnit += n; }
    else { out.acc.push(i); out.listAcc += l; out.netAcc += n; }
  }
  out.list = out.listUnit + out.listAcc;
  out.total = out.netUnit + out.netAcc;
  out.noBasic = out.acc.filter(i => basicRule(i) && !hasBasic);
  return out;
}

function stepper(i) {
  const q = st.qty[i.id] || 0;
  if (!q) return `<span class="step"><button class="add" data-id="${i.id}" data-d="1" type="button">Tambah</button></span>`;
  return `<span class="step"><button data-id="${i.id}" data-d="-1" type="button" aria-label="Kurangi">−</button><span class="q num">${q}</span><button data-id="${i.id}" data-d="1" type="button" aria-label="Tambah">+</button></span>`;
}

function renderCats() {
  const og = (label, kind) => `<optgroup label="${label}">` + SECS.filter(s => s.kind === kind).map(s => `<option value="${s.id}">${esc(s.short)}</option>`).join('') + '</optgroup>';
  $('cat').innerHTML = '<option value="all">Semua kategori</option>' + og('Unit', 'unit') + og('Perlengkapan', 'perl');
  $('cat').value = st.cat;
}

function renderList() {
  const c = calc(), q = st.q.trim().toLowerCase();
  let html = '', shown = 0;
  for (const s of SECS) {
    if (st.cat !== 'all' && st.cat != s.id) continue;
    const its = ITEMS.filter(i => i.sec === s.id && (!q || (i.name + ' ' + s.short).toLowerCase().includes(q)));
    if (!its.length) continue;
    const tag = s.kind === 'unit' ? (s.basic ? '<span class="pill">Unit Basic</span>' : '<span class="pill">Unit</span>')
      : (s.needsBasic ? '<span class="pill">Diskon bareng unit hanya dengan Basic</span>' : '<span class="pill">Perlengkapan</span>');
    html += `<div class="sech"><span>${s.kind === 'unit' ? 'Unit' : 'Perlengkapan'} · ${esc(s.short)} <small>${its.length} item</small></span>${tag}</div>`;
    for (const i of its) {
      const [n, d] = parts(i), list = i.p[st.branch];
      const nett = c.net(i);
      html += `<div class="row${st.qty[i.id] ? ' on' : ''}">
        <div class="nm">${esc(n)}${d ? `<small>${esc(d)}</small>` : ''}</div>
        <div class="pr num"><span class="net">${rp(nett)}</span><span class="list">${rp(list)}</span></div>
        ${stepper(i)}</div>`;
      shown++;
    }
  }
  $('list').innerHTML = shown ? html : '<div class="empty">Tidak ada produk yang cocok dengan pencarian.</div>';
}

function renderCart() {
  const c = calc();
  let notes = '';
  if (c.noBasic.length) notes += `<div class="note">Perlengkapan Rotary/Mower tanpa unit Basic dihitung diskon ${st.rAcc}%. Tambahkan unit Basic (Kronos, Amberjack, Boxer Rotary) untuk diskon ${st.rBun}%.</div>`;
  if (c.acc.length && !c.hasUnit) notes += `<div class="note ok">Perlengkapan tanpa unit, diskon ${st.rAcc}%.</div>`;
  $('notes').innerHTML = notes;

  const line = i => {
    const q = st.qty[i.id], [n] = parts(i), bad = false;
    return `<div class="ln"><div class="t${bad ? ' bad' : ''}">${esc(n)}</div><div class="amt num">${rp(c.net(i) * q)}</div>
      <div class="s num">${rp(c.net(i))} × ${q} · diskon ${c.rate(i)}%</div>${stepper(i)}</div>`;
  };
  let html = '';
  if (c.unit.length) html += '<h3>Unit</h3>' + c.unit.map(line).join('');
  if (c.acc.length) html += '<h3>Perlengkapan</h3>' + c.acc.map(line).join('');
  $('lines').innerHTML = html || '<div class="empty">Belum ada item. Tambahkan unit atau perlengkapan dari daftar.</div>';

  const row = (a, b, cls = '') => `<span class="${cls}">${a}</span><span class="r num ${cls}">${b}</span>`;
  let s = '';
  if (c.unit.length) s += row('Unit, harga list', rp(c.listUnit), 'muted') + row(`Diskon unit ${st.rUnit}%`, '− ' + rp(c.listUnit - c.netUnit), 'neg') + row('Unit nett', rp(c.netUnit));
  if (c.acc.length) {
    s += row('Perlengkapan, harga list', rp(c.listAcc), 'muted');
    const g = {};
    for (const i of c.acc) { const r = c.rate(i); g[r] = (g[r] || 0) + i.p[st.branch] * st.qty[i.id] - c.net(i) * st.qty[i.id]; }
    for (const r of Object.keys(g).sort((a, b) => b - a)) s += row(`Diskon perlengkapan ${r}%`, '− ' + rp(g[r]), 'neg');
    s += row('Perlengkapan nett', rp(c.netAcc));
  }
  $('sum').innerHTML = s;
  $('sum').hidden = !s;
  $('total').textContent = rp(c.total);
  $('barTotal').textContent = rp(c.total);
  $('save').textContent = c.list > c.total ? `Hemat ${rp(c.list - c.total)} dari harga list` : '';
}

function render() { renderList(); renderCart(); }

function buildText() {
  const c = calc(), L = [`Penawaran Quick, cabang ${BR[st.branch]}`, ''];
  const sec = (title, arr) => { if (!arr.length) return; L.push(title); arr.forEach(i => { const q = st.qty[i.id]; L.push(`- ${parts(i)[0]} × ${q} (diskon ${c.rate(i)}%): ${rp(c.net(i) * q)}`); }); L.push(''); };
  sec('UNIT', c.unit); sec('PERLENGKAPAN', c.acc);
  if (c.unit.length) L.push(`Unit nett (diskon ${st.rUnit}%): ${rp(c.netUnit)}`);
  if (c.acc.length) L.push(`Perlengkapan nett: ${rp(c.netAcc)}`);
  L.push(`TOTAL: ${rp(c.total)}`);
  return L.join('\n');
}

function init() {
  $('branch').innerHTML = BR.map((b, i) => `<option value="${i}">${esc(b)}</option>`).join('');
  $('branch').onchange = e => { st.branch = +e.target.value; render(); };
  $('q').oninput = e => { st.q = e.target.value; renderList(); };
  $('cat').onchange = e => { st.cat = e.target.value === 'all' ? 'all' : +e.target.value; renderList(); };
  const step = e => {
    const b = e.target.closest('[data-id]'); if (!b || b.disabled) return;
    const id = +b.dataset.id, v = Math.max(0, (st.qty[id] || 0) + +b.dataset.d);
    if (v) st.qty[id] = v; else delete st.qty[id];
    render();
  };
  $('list').onclick = step; $('lines').onclick = step;
  $('clear').onclick = () => { st.qty = {}; render(); };
  for (const [id, k] of [['rUnit', 'rUnit'], ['rAcc', 'rAcc'], ['rBun', 'rBun']]) $(id).oninput = e => {
    const v = parseFloat(e.target.value); st[k] = isNaN(v) ? 0 : Math.min(100, Math.max(0, v)); render();
  };
  $('toCart').onclick = () => $('ringkasan').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('copy').onclick = async () => {
    const t = buildText(), b = $('copy'); let ok = false;
    try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    b.textContent = ok ? 'Tersalin' : 'Gagal menyalin'; setTimeout(() => b.textContent = 'Salin penawaran', 1600);
  };
  renderCats(); render();
}
init();
</script>
