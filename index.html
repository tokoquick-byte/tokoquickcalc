<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Harga Quick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: katalog di kiri dengan toolbar menempel, ringkasan di kanan (desktop) atau panel geser dari bawah (HP). */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --surface2: #e9eee6;
  --line: #d7ded3;
  --fg: #1a2118;
  --muted: #5a6557;
  --accent: #2c6a38;
  --on-accent: #ffffff;
  --accent-soft: #dcebdc;
  --warn: #8a5200;
  --warn-bg: #fff0d1;
  --perl: #9a4f0f;
  --perl-soft: #fbe9d7;
  --on-perl: #ffffff;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11160f; --surface: #1a2117; --surface2: #242c21; --line: #303a2c;
    --fg: #e5eae2; --muted: #98a493; --accent: #7cc28a; --on-accent: #0e180f;
    --accent-soft: #22381f; --warn: #f0b75a; --warn-bg: #3a2c10; --perl: #f0a566; --perl-soft: #3b2a18; --on-perl: #1b1209; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11160f; --surface: #1a2117; --surface2: #242c21; --line: #303a2c;
  --fg: #e5eae2; --muted: #98a493; --accent: #7cc28a; --on-accent: #0e180f;
  --accent-soft: #22381f; --warn: #f0b75a; --warn-bg: #3a2c10; --perl: #f0a566; --perl-soft: #3b2a18; --on-perl: #1b1209; color-scheme: dark;
}
* { box-sizing: border-box; }
html.lock { overflow: hidden; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--font-head); font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
.branch { display: flex; flex-direction: column; gap: 4px; }
.lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
select, input[type=search], input[type=number] {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 40px;
}
select { font-weight: 500; }
.branch select { min-width: 180px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }

/* Toolbar */
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; box-shadow: 0 6px 12px -10px rgba(0, 0, 0, 0.5); }
.tbrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tbrow select { flex: 1 1 130px; min-width: 0; }
.tbrow input { flex: 2 1 140px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface2); }
.seg button { border: 0; background: transparent; padding: 8px 14px; min-height: 38px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }
.seg button[data-grp=perl][aria-pressed=true] { background: var(--perl); color: var(--on-perl); }
.cnt:not(:empty) { margin-left: 6px; background: var(--surface); color: var(--accent); border-radius: 999px; padding: 0 7px; font-size: 12px; }
.seg button[data-grp=perl] .cnt:not(:empty) { color: var(--perl); }
.unit { --kc: var(--accent); --ks: var(--accent-soft); --ko: var(--on-accent); }
.perl { --kc: var(--perl); --ks: var(--perl-soft); --ko: var(--on-perl); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 38px; cursor: pointer; font-size: 13px; font-weight: 500; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.toolbar.dim .seg, .toolbar.dim #cat { opacity: 0.45; }

/* Daftar produk */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 16px; }
.hint { padding: 8px 12px; font-size: 12px; color: var(--muted); background: var(--accent-soft); }
.sech { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--ks); color: var(--kc); border-block: 1px solid var(--line); border-left: 4px solid var(--kc); font-family: var(--font-head); font-weight: 600; font-size: 13px; }
.sech:first-child { border-top: 0; }
.sech small { font-family: var(--font-body); font-weight: 500; opacity: 0.85; font-size: 12px; }
.pill { font-family: var(--font-body); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--kc); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 16px; align-items: center; padding: 12px 12px 12px 10px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--kc); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface2); }
.row.on, .row.on:hover { background: var(--ks); }
.nm { min-width: 0; overflow-wrap: anywhere; }
.nmt { font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
.fit { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; line-height: 1.6; }
.row.on .fit { background: var(--surface); }
.eng { font-size: 12px; color: var(--muted); }
.spec { font-size: 12px; color: var(--muted); font-style: italic; }
.det { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.more { background: none; border: 0; padding: 4px 0 2px; margin-top: 2px; color: var(--kc); font-size: 12px; font-weight: 600; cursor: pointer; display: block; }
.pr { text-align: right; white-space: nowrap; }
.pr .net { display: block; font-weight: 600; font-size: 16px; }
.pr .per { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.pr .was { color: var(--muted); font-size: 12px; text-decoration: line-through; }
.pr .disc { font-size: 11px; font-weight: 600; color: var(--kc); background: var(--ks); border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
.row.on .pr .disc { background: var(--surface); }
@media (max-width: 560px) { .seg button { padding: 8px 10px; } .chip { padding: 6px 10px; } .tbrow:first-child { flex-wrap: nowrap; } .row { grid-template-columns: minmax(0, 1fr) auto; } .row .pr { grid-column: 1; text-align: left; } .row .step { grid-column: 2; grid-row: 1 / span 2; } h1 { font-size: 20px; } }

.step { display: inline-flex; align-items: center; gap: 2px; }
.step button { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
.step button:hover { border-color: var(--accent); }
.step .q { min-width: 30px; text-align: center; font-weight: 600; }
.step .add { width: auto; padding: 0 14px; font-size: 13px; font-weight: 600; background: var(--kc, var(--accent)); color: var(--ko, var(--on-accent)); border-color: var(--kc, var(--accent)); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
@media (pointer: coarse) {
  .step button { width: 42px; height: 42px; }
  .step .add { width: auto; padding: 0 16px; }
  .ln .step button { width: 38px; height: 38px; }
  .seg button, .chip { min-height: 42px; }
  select, input[type=search], input[type=number] { min-height: 44px; }
}

/* Ringkasan */
.cart { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; }
.cart > * { padding-inline: 14px; }
.cart h2 { font-family: var(--font-head); font-size: 16px; margin: 0; padding-block: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 1; border-radius: 8px 8px 0 0; }
.hbtns { display: flex; gap: 14px; align-items: center; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; padding: 6px 0; }
.close { display: none; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; margin: 10px 14px 0; font-size: 13px; }
.note.ok { background: var(--accent-soft); color: var(--accent); }
.lines { padding-block: 6px; max-height: 340px; overflow-y: auto; }
.lines h3 { margin: 10px 0 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--kc); display: flex; align-items: center; gap: 6px; }
.lines h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kc); }
.ln.perl, .ln.unit { padding-left: 10px; border-left: 3px solid var(--kc); margin-left: 0; }
.ln .fit { margin-left: 4px; }
.ln { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: center; }
.ln .t { font-weight: 500; overflow-wrap: anywhere; font-size: 13px; }
.ln .s { color: var(--muted); font-size: 12px; }
.ln .step button { width: 30px; height: 30px; font-size: 16px; }
.ln .amt { text-align: right; font-weight: 600; }
.sum { padding-block: 10px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.sum .muted { color: var(--muted); }
.sum .r { text-align: right; }
.sum .neg { color: var(--accent); }
.total { padding-block: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.total .v { font-family: var(--font-head); font-size: 24px; font-weight: 600; }
.save { color: var(--accent); font-size: 12px; text-align: right; padding-bottom: 12px; }
.acts { padding-block: 0 14px; display: flex; gap: 8px; }
.btn { flex: 1; border-radius: 6px; padding: 11px 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); }
details.cfg { border-top: 1px solid var(--line); padding-block: 10px; }
details.cfg summary { cursor: pointer; font-weight: 600; font-size: 13px; padding-block: 4px; }
.cfgg { display: grid; grid-template-columns: 1fr 84px; gap: 8px 12px; align-items: center; margin-top: 10px; font-size: 13px; }
.cfgg input[type=number] { width: 100%; text-align: right; }

/* Bar total + panel geser (HP) */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.bar .v { font-family: var(--font-head); font-size: 20px; font-weight: 600; }
.bar .btn { flex: 0 0 auto; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.5); }

@media (min-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr) 390px; }
  .side { position: sticky; top: 16px; }
  .bar, .scrim { display: none !important; }
  body { padding-bottom: 24px; }
}
@media (max-width: 899px) {
  .side { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; transform: translateY(105%); visibility: hidden; }
  .side.open { transform: none; visibility: visible; }
  .side .cart { max-height: 88vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .lines { max-height: none; overflow: visible; }
  .close { display: inline-block; }
}
@media (max-width: 899px) and (prefers-reduced-motion: no-preference) { .side { transition: transform .22s ease, visibility .22s; } }
@media (prefers-reduced-motion: no-preference) { .row, .chip, .step button, .seg button { transition: background-color .12s, border-color .12s; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>Kalkulator Harga Quick</h1>
      <p class="sub">Pricelist non-peti · internal</p>
    </div>
    <div class="branch">
      <label class="lbl" for="branch">Cabang</label>
      <select id="branch"></select>
    </div>
  </header>

  <div class="main">
    <section aria-label="Daftar produk">
      <div class="toolbar" id="toolbar">
        <div class="tbrow">
          <div class="seg" role="group" aria-label="Jenis produk">
            <button type="button" data-grp="unit" aria-pressed="true">Unit<span class="cnt" id="cntUnit"></span></button>
            <button type="button" data-grp="perl" aria-pressed="false">Perlengkapan<span class="cnt" id="cntPerl"></span></button>
          </div>
          <button type="button" class="chip" id="only" aria-pressed="false">Terpilih<span class="cnt" id="cntAll"></span></button>
        </div>
        <div class="tbrow">
          <select id="cat" aria-label="Kategori"></select>
          <input id="q" type="search" placeholder="Cari, mis. G 1000, Kronos, roda besi" aria-label="Cari produk">
        </div>
      </div>
      <div class="list" id="list"></div>
    </section>

    <aside class="side" id="ringkasan" aria-label="Ringkasan penawaran">
      <div class="cart">
        <h2><span>Ringkasan penawaran</span><span class="hbtns"><button class="link" id="clear" type="button">Kosongkan</button><button class="link close" id="closeSheet" type="button">Tutup</button></span></h2>
        <div id="notes"></div>
        <div class="lines" id="lines"></div>
        <div class="sum" id="sum"></div>
        <div class="total"><span class="lbl">Total nett</span><span class="v num" id="total">Rp 0</span></div>
        <div class="save num" id="save"></div>
        <div class="acts">
          <button class="btn" id="copy" type="button">Salin penawaran</button>
        </div>
        <details class="cfg">
          <summary>Pengaturan diskon</summary>
          <div class="cfgg">
            <label for="rUnit">Diskon unit (%)</label><input id="rUnit" type="number" min="0" max="100" step="0.5" value="20">
            <label for="rAcc">Diskon perlengkapan saja (%)</label><input id="rAcc" type="number" min="0" max="100" step="0.5" value="12">
            <label for="rBun">Perlengkapan bareng unit (%)</label><input id="rBun" type="number" min="0" max="100" step="0.5" value="20">
          </div>
        </details>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="bar" id="bar">
  <div><div class="lbl"><span id="barCount">0 item</span> · total nett</div><div class="v num" id="barTotal">Rp 0</div></div>
  <button class="btn" id="toCart" type="button" aria-expanded="false" aria-controls="ringkasan">Lihat ringkasan</button>
</div>

t":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":155,"sec":10,"name":"Main Rotary Blade B 100 Cakar Baja (Set)","p":[1440000,1444000,1452000,1458000,1458000,1460000,1460000],"n":"Main Rotary Blade B 100","fit":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":156,"sec":10,"name":"Main Rotary Blade B 240 Cakar Baja (Set)","p":[1800000,1810000,1826000,1836000,1838000,1843000,1843000],"n":"Main Rotary Blade B 240","fit":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":157,"sec":10,"name":"Ext. Drum Blade B 200 Cakar Baja (Set)","p":[1340000,1347000,1360000,1368000,1371000,1374000,1374000],"n":"Ext. Drum Blade B 200","fit":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":158,"sec":10,"name":"Main Rotary Blade J Cakar Baja (Set)","p":[1670000,1702000,1756000,1792000,1797000,1813000,1813000],"n":"Main Rotary Blade J","fit":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":159,"sec":10,"name":"Main Rotary Blade S Cakar Baja (Set)","p":[1860000,1880000,1915000,1938000,1942000,1952000,1952000],"n":"Main Rotary Blade S","fit":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":160,"sec":10,"name":"Stabilizer Disc Set Cakar Baja (Set)","p":[170000,172000,172000,172000,173000,173000,173000],"n":"Stabilizer Disc Set","fit":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":161,"sec":10,"name":"Paket Bajak Cakar Baja (Set)","p":[1090000,1100000,1116000,1126000,1128000,1132000,1132000],"n":"Paket Bajak","fit":["Cakar Baja"],"spec":"","u":"set","eng":"","det":null},{"id":162,"sec":10,"name":"Garu Cakar Baja (Unt)","p":[440000,492000,582000,639000,647000,675000,675000],"n":"Garu","fit":["Cakar Baja"],"spec":"","u":"unt","eng":"","det":null},{"id":163,"sec":10,"name":"Ridger Cakar Baja / Mini (Unt)","p":[990000,1014000,1056000,1081000,1085000,1098000,1098000],"n":"Ridger","fit":["Cakar Baja","Mini"],"spec":"","u":"unt","eng":"","det":null},{"id":164,"sec":10,"name":"Blade S 500/720/920 CBM (Set)","p":[3600000,3615000,3640000,3656000,3659000,3667000,3667000],"n":"Blade S 500/720/920 CBM","fit":[],"spec":"","u":"set","eng":"","det":null},{"id":165,"sec":10,"name":"Blade J 250 CBM (Set)","p":[810000,813000,818000,822000,825000,825000,825000],"n":"Blade J 250 CBM","fit":[],"spec":"","u":"set","eng":"","det":null},{"id":166,"sec":10,"name":"Blade J 600 CBM (Set)","p":[1940000,1950000,1967000,1978000,1980000,1986000,1986000],"n":"Blade J 600 CBM","fit":[],"spec":"","u":"set","eng":"","det":null},{"id":167,"sec":10,"name":"Blade J Kasuari (Set)","p":[2070000,2077000,2088000,2094000,2089000,2090000,2090000],"n":"Blade J","fit":["Kasuari"],"spec":"","u":"set","eng":"","det":null},{"id":168,"sec":10,"name":"Ridger Kasuari (Set)","p":[890000,900000,914000,924000,916000,918000,918000],"n":"Ridger","fit":["Kasuari"],"spec":"","u":"set","eng":"","det":null}]};
const { branches: BR, sections: SECS, items: ITEMS } = DATA;
const SEC = Object.fromEntries(SECS.map(s => [s.id, s]));
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Selalu mulai kosong.
const st = { branch: 0, qty: {}, grp: 'unit', cat: 1, q: '', only: false, open: {}, rUnit: 20, rAcc: 12, rBun: 20 };

// Nama yang dipakai di keranjang dan teks salinan: nama + tipe yang cocok.
const full = i => i.n + (i.fit && i.fit.length ? ' · ' + i.fit.join('/') : '');
const kindOf = i => SEC[i.sec].kind === 'unit' ? 'unit' : 'perl';

// Perlengkapan Rotary/Mower (kecuali Zena): diskon bundling hanya jika ada unit Basic. Lainnya: jika ada unit apa pun.
const basicRule = i => SEC[i.sec].needsBasic && !/zena/i.test(i.name);
function calc() {
  const lines = ITEMS.filter(i => (st.qty[i.id] || 0) > 0);
  const hasUnit = lines.some(i => SEC[i.sec].kind === 'unit');
  const hasBasic = lines.some(i => SEC[i.sec].basic);
  const rate = i => SEC[i.sec].kind === 'unit' ? st.rUnit : ((basicRule(i) ? hasBasic : hasUnit) ? st.rBun : st.rAcc);
  const net = i => Math.round(i.p[st.branch] * (1 - rate(i) / 100));
  const out = { hasUnit, hasBasic, rate, net, unit: [], acc: [], listUnit: 0, netUnit: 0, listAcc: 0, netAcc: 0 };
  for (const i of lines) {
    const q = st.qty[i.id], l = i.p[st.branch] * q, n = net(i) * q;
    if (SEC[i.sec].kind === 'unit') { out.unit.push(i); out.listUnit += l; out.netUnit += n; }
    else { out.acc.push(i); out.listAcc += l; out.netAcc += n; }
  }
  out.list = out.listUnit + out.listAcc;
  out.total = out.netUnit + out.netAcc;
  out.noBasic = out.acc.filter(i => basicRule(i) && !hasBasic);
  return out;
}

const qtyIn = pred => ITEMS.reduce((n, i) => n + ((st.qty[i.id] || 0) && pred(i) ? st.qty[i.id] : 0), 0);

function stepper(i) {
  const q = st.qty[i.id] || 0;
  if (!q) return `<span class="step"><button class="add" data-id="${i.id}" data-d="1" type="button">Tambah</button></span>`;
  return `<span class="step"><button data-id="${i.id}" data-d="-1" type="button" aria-label="Kurangi">−</button><span class="q num">${q}</span><button data-id="${i.id}" data-d="1" type="button" aria-label="Tambah">+</button></span>`;
}

function renderToolbar() {
  const filtering = !!st.q.trim() || st.only;
  document.querySelectorAll('[data-grp]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.grp === st.grp)));
  $('cntUnit').textContent = qtyIn(i => SEC[i.sec].kind === 'unit') || '';
  $('cntPerl').textContent = qtyIn(i => SEC[i.sec].kind === 'perl') || '';
  $('cntAll').textContent = qtyIn(() => true) || '';
  $('only').setAttribute('aria-pressed', String(st.only));
  $('cat').innerHTML = `<option value="all">${st.grp === 'unit' ? 'Semua unit' : 'Semua perlengkapan'}</option>` +
    SECS.filter(s => s.kind === st.grp).map(s => {
      const n = qtyIn(i => i.sec === s.id);
      return `<option value="${s.id}">${esc(s.short)}${n ? ` · ${n}` : ''}</option>`;
    }).join('');
  $('cat').value = String(st.cat);
  $('toolbar').classList.toggle('dim', filtering);
}

function renderList() {
  const c = calc(), q = st.q.trim().toLowerCase(), filtering = !!q || st.only;
  let html = '', shown = 0;
  if (filtering) html += `<div class="hint">${st.only ? 'Hanya item terpilih' + (q ? ' yang cocok dengan pencarian' : '') : 'Hasil pencarian di semua kategori'}</div>`;
  for (const s of SECS) {
    if (!filtering && (s.kind !== st.grp || (st.cat !== 'all' && st.cat != s.id))) continue;
    const its = ITEMS.filter(i => i.sec === s.id && (!st.only || st.qty[i.id]) && (!q || (i.name + ' ' + s.short).toLowerCase().includes(q)));
    if (!its.length) continue;
    const kc = s.kind === 'unit' ? 'unit' : 'perl';
    const tag = s.basic ? '<span class="pill">Paket Basic</span>' : (s.needsBasic ? `<span class="pill">Diskon ${st.rBun}% hanya bareng Basic</span>` : '');
    const lead = filtering ? (s.kind === 'unit' ? 'Unit · ' : 'Perlengkapan · ') : '';
    html += `<div class="sech ${kc}"><span>${lead}${esc(s.short)} <small>${its.length} item</small></span>${tag}</div>`;
    for (const i of its) {
      const list = i.p[st.branch], r = c.rate(i), open = !!st.open[i.id];
      const meta = (i.fit || []).map(f => `<span class="fit">${esc(f)}</span>`).join('')
        + (i.eng ? `<span class="eng">+ ${esc(i.eng)}</span>` : '') + (i.spec ? `<span class="spec">${esc(i.spec)}</span>` : '');
      const more = i.det ? `<button class="more" type="button" data-more="${i.id}" aria-expanded="${open}">${open ? 'Sembunyikan isi paket ▴' : 'Isi paket ▾'}</button>`
        + (open ? `<div class="det">${i.det.map(x => `<span class="fit">${esc(x)}</span>`).join('')}</div>` : '') : '';
      html += `<div class="row ${kc}${st.qty[i.id] ? ' on' : ''}" data-row="${i.id}">
        <div class="nm"><span class="nmt">${esc(i.n)}</span>${meta ? `<div class="meta">${meta}</div>` : ''}${more}</div>
        <div class="pr num"><span class="net">${rp(c.net(i))}${i.u ? `<span class="per">/${i.u}</span>` : ''}</span><span class="was">${rp(list)}</span>${r ? `<span class="disc">−${r}%</span>` : ''}</div>
        ${stepper(i)}</div>`;
      shown++;
    }
  }
  const emptyMsg = st.only ? 'Belum ada item terpilih.' : 'Tidak ada produk yang cocok dengan pencarian.';
  $('list').innerHTML = shown ? html : html + `<div class="empty">${emptyMsg}</div>`;
}

function renderCart() {
  const c = calc();
  let notes = '';
  if (c.noBasic.length) notes += `<div class="note">Rotary/Mower tanpa unit Basic: diskon ${st.rAcc}%. Tambah unit Basic untuk ${st.rBun}%.</div>`;
  if (c.acc.length && !c.hasUnit) notes += `<div class="note ok">Tanpa unit: diskon perlengkapan ${st.rAcc}%.</div>`;
  $('notes').innerHTML = notes;

  const line = i => {
    const q = st.qty[i.id];
    return `<div class="ln ${kindOf(i)}"><div class="t">${esc(i.n)}${(i.fit || []).map(f => `<span class="fit">${esc(f)}</span>`).join('')}</div><div class="amt num">${rp(c.net(i) * q)}</div>
      <div class="s num">${rp(c.net(i))} × ${q} · −${c.rate(i)}%</div>${stepper(i)}</div>`;
  };
  let html = '';
  if (c.unit.length) html += '<h3 class="unit">Unit</h3>' + c.unit.map(line).join('');
  if (c.acc.length) html += '<h3 class="perl">Perlengkapan</h3>' + c.acc.map(line).join('');
  $('lines').innerHTML = html || '<div class="empty">Belum ada item. Tambahkan unit atau perlengkapan dari daftar.</div>';

  const row = (a, b, cls = '') => `<span class="${cls}">${a}</span><span class="r num ${cls}">${b}</span>`;
  let s = '';
  if (c.unit.length) s += row('Unit (list)', rp(c.listUnit), 'muted') + row(`Diskon ${st.rUnit}%`, '− ' + rp(c.listUnit - c.netUnit), 'neg') + row('Unit nett', rp(c.netUnit));
  if (c.acc.length) {
    s += row('Perlengkapan (list)', rp(c.listAcc), 'muted');
    const g = {};
    for (const i of c.acc) { const r = c.rate(i); g[r] = (g[r] || 0) + i.p[st.branch] * st.qty[i.id] - c.net(i) * st.qty[i.id]; }
    for (const r of Object.keys(g).sort((a, b) => b - a)) s += row(`Diskon ${r}%`, '− ' + rp(g[r]), 'neg');
    s += row('Perlengkapan nett', rp(c.netAcc));
  }
  $('sum').innerHTML = s;
  $('sum').hidden = !s;
  $('total').textContent = rp(c.total);
  $('barTotal').textContent = rp(c.total);
  $('barCount').textContent = qtyIn(() => true) + ' item';
  $('save').textContent = c.list > c.total ? `Hemat ${rp(c.list - c.total)} dari harga list` : '';
}

function render() { renderToolbar(); renderList(); renderCart(); }

function buildText() {
  const c = calc(), L = [`Penawaran Quick, cabang ${BR[st.branch]}`, ''];
  const sec = (title, arr) => { if (!arr.length) return; L.push(title); arr.forEach(i => { const q = st.qty[i.id]; L.push(`- ${full(i)} × ${q} (−${c.rate(i)}%): ${rp(c.net(i) * q)}`); }); L.push(''); };
  sec('UNIT', c.unit); sec('PERLENGKAPAN', c.acc);
  if (c.unit.length) L.push(`Unit nett (−${st.rUnit}%): ${rp(c.netUnit)}`);
  if (c.acc.length) L.push(`Perlengkapan nett: ${rp(c.netAcc)}`);
  L.push(`TOTAL: ${rp(c.total)}`);
  return L.join('\n');
}

function sheet(open) {
  $('ringkasan').classList.toggle('open', open);
  $('scrim').hidden = !open;
  $('toCart').setAttribute('aria-expanded', String(open));
  document.documentElement.classList.toggle('lock', open);
}

function init() {
  $('branch').innerHTML = BR.map((b, i) => `<option value="${i}">${esc(b)}</option>`).join('');
  $('branch').onchange = e => { st.branch = +e.target.value; render(); };
  $('q').oninput = e => { st.q = e.target.value; renderToolbar(); renderList(); };
  $('cat').onchange = e => { st.cat = e.target.value === 'all' ? 'all' : +e.target.value; renderList(); };
  document.querySelectorAll('[data-grp]').forEach(b => b.onclick = () => { st.grp = b.dataset.grp; st.cat = 'all'; st.only = false; renderToolbar(); renderList(); });
  $('only').onclick = () => { st.only = !st.only; renderToolbar(); renderList(); };

  const bump = (id, d) => {
    const v = Math.max(0, (st.qty[id] || 0) + d);
    if (v) st.qty[id] = v; else delete st.qty[id];
    render();
  };
  $('list').onclick = e => {
    const m = e.target.closest('[data-more]');
    if (m) { st.open[m.dataset.more] = !st.open[m.dataset.more]; renderList(); return; }
    const b = e.target.closest('[data-id]');
    if (b) { bump(+b.dataset.id, +b.dataset.d); return; }
    const r = e.target.closest('[data-row]');
    if (r) bump(+r.dataset.row, 1);
  };
  $('lines').onclick = e => { const b = e.target.closest('[data-id]'); if (b) bump(+b.dataset.id, +b.dataset.d); };
  $('clear').onclick = () => { st.qty = {}; render(); };
  for (const k of ['rUnit', 'rAcc', 'rBun']) $(k).oninput = e => {
    const v = parseFloat(e.target.value); st[k] = isNaN(v) ? 0 : Math.min(100, Math.max(0, v)); render();
  };
  $('toCart').onclick = () => sheet(!$('ringkasan').classList.contains('open'));
  $('closeSheet').onclick = () => sheet(false);
  $('scrim').onclick = () => sheet(false);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') sheet(false); });
  window.addEventListener('resize', () => { if (innerWidth >= 900) sheet(false); });
  $('copy').onclick = async () => {
    const t = buildText(), b = $('copy'); let ok = false;
    try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    b.textContent = ok ? 'Tersalin' : 'Gagal menyalin'; setTimeout(() => b.textContent = 'Salin penawaran', 1600);
  };
  render();
}
init();
</script>
